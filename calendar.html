<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference Calendar | UM Psychiatry Research Hub</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { padding-top: 64px; background: var(--cream); }
    .app-nav-links { display: flex; gap: 4px; }
    .app-nav-link { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 0.88rem; font-weight: 500; padding: 6px 14px; border-radius: 6px; transition: all var(--transition); }
    .app-nav-link:hover { color: var(--white); background: rgba(255,255,255,0.08); }
    .app-nav-link.active { color: var(--white); background: rgba(255,255,255,0.12); }
    .page-header { background: var(--green); padding: 48px 0 40px; }
    .page-header h1 { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: var(--white); margin-bottom: 8px; }
    .page-header p { color: rgba(255,255,255,0.65); font-size: 0.95rem; }
    .calendar-container { max-width: 860px; margin: 0 auto; padding: 40px 16px 48px; }
    .loading-state, .empty-state { text-align: center; padding: 60px 24px; color: #6b7280; }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #005030; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status colors: green = upcoming, red = past, blue = TBD */
    :root { --st-up: #15803d; --st-up-bg: #dcfce7; --st-past: #b91c1c; --st-past-bg: #fee2e2; --st-tbd: #1d4ed8; --st-tbd-bg: #dbeafe; }

    .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; color: #4b5563; margin-bottom: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    .conf-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); transition: box-shadow 0.2s; }
    .conf-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .conf-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
    .conf-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #111827; margin-bottom: 4px; }
    .conf-org { font-size: 0.9rem; color: #6b7280; }
    .btn-website { background: #005030; color: white; border: none; border-radius: 8px; padding: 9px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background 0.2s; }
    .btn-website:hover { background: #003d24; }

    .edition { border-left: 4px solid var(--st-tbd); background: #f9fafb; border-radius: 8px; padding: 14px 16px; margin-top: 10px; }
    .edition.up { border-left-color: var(--st-up); }
    .edition.past { border-left-color: var(--st-past); }
    .edition-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .edition-year { font-weight: 700; font-size: 1rem; color: #111827; }
    .pill { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 100px; }
    .pill.up { background: var(--st-up-bg); color: var(--st-up); }
    .pill.past { background: var(--st-past-bg); color: var(--st-past); }
    .pill.tbd { background: var(--st-tbd-bg); color: var(--st-tbd); }
    .edition-dates { display: flex; gap: 24px; flex-wrap: wrap; }
    .date-block label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin-bottom: 2px; }
    .date-block span { font-size: 0.95rem; font-weight: 600; }
    .date-block span.up { color: var(--st-up); }
    .date-block span.past { color: var(--st-past); }
    .date-block span.tbd { color: var(--st-tbd); }
    .conf-meta { font-size: 0.86rem; color: #6b7280; margin-top: 8px; }
    .tbd-text { color: var(--st-tbd); font-weight: 600; }
    .conf-notes { font-size: 0.86rem; color: #4b5563; background: white; border: 1px solid #f0f0f0; border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
    .edition a.small-link { font-size: 0.82rem; color: #005030; font-weight: 600; }
    .section-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand" style="text-decoration:none;">
        <div class="nav-logo">U</div>
        <div class="nav-brand-text">
          <span class="nav-title">UM Psychiatry</span>
          <span class="nav-sub">Research Hub</span>
        </div>
      </a>
      <div class="app-nav-links">
        <a href="projects.html" class="app-nav-link">Projects</a>
        <a href="calendar.html" class="app-nav-link active">Calendar</a>
        <a href="resources.html" class="app-nav-link">Resources</a>
        <a href="dashboard.html" class="app-nav-link">Admin</a>
      </div>
      <a href="index.html" class="btn btn-outline" style="font-size:0.82rem; padding:6px 16px;">Sign Out</a>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Conference Calendar</h1>
      <p>Track abstract deadlines and conference dates for psychiatry research opportunities.</p>
    </div>
  </section>

  <div class="calendar-container">
    <div id="calendar-content">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading conferences...</p>
      </div>
    </div>
  </div>

  <script>
    // ---------- Date helpers (all automatic, based on today's date) ----------
    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    const TODAY = todayStr();
    // Every conference card shows a row for this year and next year (rolls forward automatically each January)
    const THIS_YEAR = new Date().getFullYear();
    const SHOW_YEARS = [THIS_YEAR, THIS_YEAR + 1];

    function toDate(s) { const p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
    function fmt(s, opts) { return toDate(s).toLocaleDateString('en-US', opts); }

    function formatRange(start, end) {
      if (!start) return 'TBD';
      if (!end || end === start) return fmt(start, { month: 'long', day: 'numeric', year: 'numeric' });
      const a = toDate(start), b = toDate(end);
      if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) {
        return fmt(start, { month: 'long' }) + ' ' + a.getDate() + '–' + b.getDate() + ', ' + a.getFullYear();
      }
      if (a.getFullYear() === b.getFullYear()) {
        return fmt(start, { month: 'short', day: 'numeric' }) + ' – ' + fmt(end, { month: 'short', day: 'numeric' }) + ', ' + a.getFullYear();
      }
      return fmt(start, { month: 'short', day: 'numeric', year: 'numeric' }) + ' – ' + fmt(end, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // 'tbd' (blue), 'past' (red), 'up' (green)
    function confStatus(c) {
      if (!c.conference_date) return 'tbd';
      const lastDay = c.conference_end_date || c.conference_date;
      return lastDay < TODAY ? 'past' : 'up';
    }
    function confStatusLabel(c) {
      const st = confStatus(c);
      if (st === 'tbd') return 'Dates TBD';
      if (st === 'past') return 'Past';
      return c.conference_date <= TODAY ? 'Happening now' : 'Upcoming';
    }
    function editionYear(c) {
      return String(c.edition_year || (c.conference_date ? c.conference_date.slice(0, 4) : ''));
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? esc(u) : ''; }

    // ---------- Rendering ----------
    function abstractHtml(c) {
      if (!c.abstract_date) return confStatus(c) === 'past' ? '<span class="past">Closed</span>' : '<span class="tbd">TBD</span>';
      if (c.abstract_date < TODAY) return '<span class="past">Closed · ' + fmt(c.abstract_date, { month: 'short', day: 'numeric', year: 'numeric' }) + '</span>';
      return '<span class="up">' + fmt(c.abstract_date, { month: 'long', day: 'numeric', year: 'numeric' }) + '</span>';
    }

    function renderEdition(c, headerSite) {
      const st = confStatus(c);
      const yr = editionYear(c);
      const site = safeUrl(c.website);
      return '<div class="edition ' + st + '">' +
        '<div class="edition-top">' +
          (yr ? '<span class="edition-year">' + esc(yr) + '</span>' : '') +
          '<span class="pill ' + st + '">' + confStatusLabel(c) + '</span>' +
          (site && c.website !== headerSite ? '<a class="small-link" href="' + site + '" target="_blank" rel="noopener">Website ↗</a>' : '') +
        '</div>' +
        '<div class="edition-dates">' +
          '<div class="date-block"><label>Conference Dates</label><span class="' + st + '">' + formatRange(c.conference_date, c.conference_end_date) + '</span></div>' +
          '<div class="date-block"><label>Abstract Deadline</label>' + abstractHtml(c) + '</div>' +
        '</div>' +
        (c.location ? '<div class="conf-meta">📍 ' + esc(c.location) + '</div>'
          : (st !== 'past' ? '<div class="conf-meta">📍 <span class="tbd-text">Location TBD</span></div>' : '')) +
        (c.notes ? '<div class="conf-notes">💡 ' + esc(c.notes) + '</div>' : '') +
      '</div>';
    }

    function renderGroup(g) {
      const site = g.website;
      return '<div class="conf-card">' +
        '<div class="conf-head"><div>' +
          '<div class="conf-name">' + esc(g.name || 'Untitled Conference') + '</div>' +
          (g.org ? '<div class="conf-org">' + esc(g.org) + '</div>' : '') +
        '</div>' +
        (safeUrl(site) ? '<a href="' + safeUrl(site) + '" target="_blank" rel="noopener" class="btn-website">Visit Website</a>' : '') +
        '</div>' +
        g.editions.map(e => renderEdition(e, site)).join('') +
      '</div>';
    }

    // Records with the same conference name become one card with one row per year
    function groupConferences(records) {
      const map = {};
      records.forEach(r => {
        const key = (r.name || 'untitled').trim().toLowerCase();
        (map[key] = map[key] || []).push(r);
      });
      return Object.values(map).map(all => {
        // Keep this year and later; older editions drop off automatically
        const list = all.filter(e => !editionYear(e) || Number(editionYear(e)) >= THIS_YEAR);
        // Add a "Dates TBD" row for any of this year / next year that has no entry yet
        SHOW_YEARS.forEach(y => {
          if (!list.some(e => editionYear(e) === String(y))) {
            list.push({ name: all[0].name, edition_year: y, placeholder: true });
          }
        });
        list.sort((a, b) => {
          const ya = editionYear(a) || '9999', yb = editionYear(b) || '9999';
          if (ya !== yb) return ya.localeCompare(yb);
          return (a.conference_date || '9999').localeCompare(b.conference_date || '9999');
        });
        const active = list.filter(e => confStatus(e) !== 'past');
        const activeReal = active.filter(e => !e.placeholder);
        const pick = (field) => { const src = activeReal.slice().reverse().find(e => e[field]) || all.slice().reverse().find(e => e[field]); return src ? src[field] : ''; };
        const nextDated = active.filter(e => e.conference_date).map(e => e.conference_date).sort()[0] || '';
        const lastPast = list.filter(e => confStatus(e) === 'past').map(e => e.conference_end_date || e.conference_date).sort().pop() || '';
        return { name: all[0].name, org: pick('org'), website: pick('website'), editions: list, isActive: active.length > 0, nextDated, lastPast };
      });
    }

    async function loadCalendar() {
      const container = document.getElementById('calendar-content');
      try {
        const res = await fetch('/.netlify/functions/calendar');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const records = Array.isArray(data) ? data : [];

        if (records.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>No conferences added yet. Check back soon!</p></div>';
          return;
        }

        const groups = groupConferences(records);
        const current = groups.filter(g => g.isActive).sort((a, b) => (a.nextDated || '9999').localeCompare(b.nextDated || '9999'));
        const past = groups.filter(g => !g.isActive).sort((a, b) => b.lastPast.localeCompare(a.lastPast));

        let html = '<div class="legend">' +
          '<span><i style="background:var(--st-up)"></i>Upcoming</span>' +
          '<span><i style="background:var(--st-past)"></i>Past</span>' +
          '<span><i style="background:var(--st-tbd)"></i>Dates TBD</span>' +
        '</div>';
        if (current.length) {
          html += '<div class="section-label">Upcoming &amp; Announced (' + current.length + ')</div>';
          html += current.map(renderGroup).join('');
        }
        if (past.length) {
          html += '<div class="section-label">Past Conferences (' + past.length + ')</div>';
          html += past.map(renderGroup).join('');
        }
        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="empty-state"><p>Could not load conferences. Please try again later.</p></div>';
      }
    }

    loadCalendar();
  </script>

</body>
</html>
